"$schema" = "https://open-api.netlify.com/netlify.schema.json"

[build]
  command = "npm run build"
  publish = "dist"

# Proxy all API traffic from Netlify frontend to the shared Render backend
[[redirects]]
  from = "/api/*"
  to = "https://myecommers-for-qaautomation.onrender.com/api/:splat"
  status = 200
  force = true

# Route Swagger documentation directly to the shared Render Swagger testing UI
[[redirects]]
  from = "/api-docs*"
  to = "https://myecommers-for-qaautomation.onrender.com/api-docs:splat"
  status = 302
  force = true

[[redirects]]
  from = "/docs"
  to = "https://myecommers-for-qaautomation.onrender.com/api-docs/"
  status = 302

[[redirects]]
  from = "/swagger"
  to = "https://myecommers-for-qaautomation.onrender.com/api-docs/"
  status = 302

# Single Page Application fallback rewrite for React Router / SPA navigation
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
